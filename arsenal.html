<header class="sec phead" style="padding-bottom:26px">
  <div class="phead-bg"><img src="assets/img/art/cine-hangar.webp" alt="" fetchpriority="high"></div>
  <div class="wrap">
  <h1 class="t-h1" style="margin:18px 0 16px" data-decode>Arsenal database</h1>

<div class="hazard thin"></div>

<section class="sec wrap" style="padding-top:34px">
<h2 class="sr-only">All weapons</h2>
  <div class="fbar">
    <button class="chip on" data-s="all">All</button>
    <button class="chip" data-s="PRIMARY">Primary</button>
    <button class="chip" data-s="SECONDARY">Sidearm</button>
    <button class="chip" data-s="SUPPORT">Support</button>
    <span style="width:1px;height:26px;background:var(--line)"></span>
    <button class="chip" data-t="S">S tier</button>
    <button class="chip" data-t="A">A tier</button>
    <input class="search" id="q" type="search" placeholder="Search weapon, trait or warbond" autocomplete="off">
    <select class="chip" id="sort" style="padding-right:26px">
      <option value="tier">Sort: tier</option>
      <option value="bug">Sort: best vs Terminids</option>
      <option value="bot">Sort: best vs Automatons</option>
      <option value="squid">Sort: best vs Illuminate</option>
      <option value="name">Sort: name</option>
    </select>
    <span class="count" id="resCount"></span>
  </div>
  <div class="wgrid" id="grid"></div>
  <div class="empty hide" id="none">No weapon matches that filter</div>
</section>

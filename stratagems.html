<title>Stratagem Codex · all 93 codes | Helldive Command</title>
<meta name="description" content="All 93 Helldivers 2 stratagem input codes with cooldown, uses and call-in time. Filter, search, and drill any code in the browser.">
</head>
<body>

<header class="sec phead" style="padding-bottom:26px">
  <div class="phead-bg"><img src="assets/img/art/cine-eaglestorm.webp" alt="" fetchpriority="high"></div>
  <div class="wrap">
  <h1 class="t-h1" style="margin:18px 0 16px" data-decode>Stratagem codex</h1>
  <p class="t-lead">All 93 stratagem codes with cooldown, call-in time and uses. Click any card to drill its code, or search by name or arrows.</p>
  <div class="hero-cta">
    <a class="btn" href="arcade.html#hero">Play Stratagem Hero <span class="ar">&#9654;</span></a>
    <button class="btn ghost" id="randomBtn">Random code drill</button>
  </div>
  </div>
</header>

<div class="hazard thin"></div>

<section class="sec wrap" style="padding-top:34px">
<h2 class="sr-only">All stratagems</h2>
  <div class="fbar">
    <button class="chip on" data-g="all">All <span id="cAll"></span></button>
    <button class="chip" data-g="offensive">Offensive</button>
    <button class="chip" data-g="supply">Supply</button>
    <button class="chip" data-g="defensive">Defensive</button>
    <button class="chip" data-g="mission">Mission</button>
    <input class="search" id="q" type="search" placeholder="Search name or code (try DLDUUR)" autocomplete="off">
    <span class="count" id="resCount"></span>
  </div>
  <div class="sgrid" id="grid"></div>
  <div class="empty hide" id="none">No stratagem matches that filter</div>
</section>

<!-- drill modal -->
<div class="modal" id="drill" role="dialog" aria-modal="true" aria-label="Stratagem drill">
  <button class="modal-x" id="drillX">Close &times;</button>
  <div class="modal-box">
    <div class="game" style="clip-path:none;border:0">
      <div class="game-top"><h3 id="dTitle">Drill</h3>
        <div class="game-stats"><div><b id="dStreak">0</b><span>Streak</span></div><div><b id="dBest">&mdash;</b><span>Best time</span></div><div><b id="dReps">0</b><span>Practices</span></div></div>
      </div>
      <div class="game-body"><div class="sh-stage">
        <div class="sh-icon"><img id="dIcon" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></div>
        <div class="sh-name" id="dName"></div>
        <div class="sh-cat" id="dCat"></div>
        <div class="arrows sh-arrows" id="dArrows"></div>
        <div class="sh-msg" id="dMsg">Hold Ctrl, or take out the stratagem</div>
        <button type="button" class="btn sm ghost d-arm" id="dArm" aria-pressed="false">Take out stratagem</button>
        <div class="dpad" id="dPad"></div>
        <dl style="margin-top:26px;text-align:left;max-width:420px;margin-inline:auto" id="dStats"></dl>
      </div></div>
    </div>
  </div>
</div>
